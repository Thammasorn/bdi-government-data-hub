<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ห้ามใช้ฟอนต์อีโมจิสีในตัวแปลงเอกสาร

  TH SarabunPSK ไม่มีสัญลักษณ์อย่าง ✔ ☐ อยู่ในตัว เมื่อ template สั่ง Sarabun ให้อักขระ
  เหล่านี้ LibreOffice จะไปหยิบจากฟอนต์อื่นที่มีตามลำดับของ fontconfig — และ Noto Color
  Emoji ชนะ เพราะมี ✔ (U+2714) กับ ☑ (U+2611) อยู่ด้วย

  ผลคือเครื่องหมายถูกวาดเป็น "อีโมจิ": กลายเป็นภาพบิตแมปสี (ออกมาเป็นฟอนต์ Type 3 ใน PDF)
  สูง 46.66pt บนบรรทัด 18.61pt — สูงกว่าบรรทัดสองเท่าครึ่ง ดันระยะบรรทัดบวม และกว้างกว่า
  ช่องว่างเปล่า ☐ ที่ข้างกันอยู่ 39% เอกสารราชการจึงดูเหมือนแบบฟอร์มที่จัดหน้าพัง

  ตัดฟอนต์นี้ออกจากลำดับ สัญลักษณ์จะตกไปที่ DejaVu Sans / Noto Sans Symbols2 ซึ่งเป็น
  ฟอนต์ขาวดำแบบเวกเตอร์ ได้ความสูงเท่าบรรทัดพอดี

  แลกกับอะไร: ถ้าวันหนึ่ง template ใส่อีโมจิสีจริง ๆ (🎉) มาจะขึ้นเป็นกล่องว่าง แต่เอกสาร
  กฎหมายไม่ใช้อีโมจิสี และ docs/tools/manual-to-docx.py ก็แปลงอีโมจิเป็นสัญลักษณ์ขาวดำ
  ให้อยู่แล้ว — และการเห็นกล่องว่างยังดีกว่าเครื่องหมายบวมแบบเงียบ ๆ
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Noto Color Emoji</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
