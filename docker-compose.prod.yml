# โหมด production สำหรับตอนเปิดให้เข้าจากภายนอก
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# ต่างจากโหมด dev ตรงที่:
#   - build เป็นบันเดิลจริง ไม่มี source map / HMR / stack trace เต็ม ๆ หลุดออกไป
#   - ไม่ bind-mount source เข้าไป โค้ดที่รันคือสิ่งที่ build ไว้เท่านั้น
#   - รันด้วย user `node` ไม่ใช่ root
#
# NEXT_PUBLIC_* ต้องส่งเป็น build arg เพราะถูกฝังลงบันเดิลตอน build
# เปลี่ยนค่าแล้วต้อง --build ใหม่เสมอ

services:
  # log ของ backend / worker / frontend มีเพดาน: json-file ของ docker ไม่จำกัดขนาดโดยค่าตั้งต้น และ /hdd1tb ที่เก็บมัน
  # คือดิสก์เดียวกับ Postgres ของ production · 50 MB × 5 ไฟล์ต่อ service เกินพอสำหรับ "dump log ก่อน deploy"
  # GIT_SHA → RELEASE ของ image (backend/Dockerfile) — ตั้งใน shell ตอน deploy ดู docs/21 · ไม่ตั้งได้ `unknown`
  backend:
    build:
      target: runner
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      NODE_ENV: production
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"
    volumes: !reset []
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    volumes: !reset []
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # worker ต้องรันเป็น production ด้วย ไม่งั้นมันจะรัน tsx จาก source ที่ bind-mount ไว้
  # ทั้งที่ backend ข้าง ๆ รันบันเดิลที่ build แล้ว — และ NODE_ENV จะไม่ใช่ production
  # ทำให้ด่านตรวจ secret ใน env.ts ไม่ทำงานกับ process นี้
  #
  # ไม่รัน migrate deploy ที่นี่ backend เป็นคนรันให้ตอนบูต worker แค่รอ
  # ตารางพร้อม (tick แรกอาจล้มเหลวถ้าชิงกันบูต แล้วรอบถัดไปจะผ่านเอง)
  delivery-worker:
    build:
      target: runner
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      NODE_ENV: production
    command: ["node", "dist/workers/delivery.js"]
    volumes: !reset []
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # MongoDB (log store) — ต้องอยู่ในไฟล์นี้ด้วยเหตุผลเดียวกับ azurite/gotenberg ข้างล่าง และต่างจาก dev สองอย่าง:
  #
  #   - cache 0.5 GB แทน 0.25
  #   - **ไม่ยอมเริ่มด้วยรหัสผ่านตัวอย่าง**: MONGO_REFUSE_DEV_PASSWORDS ทำให้ mongo/entrypoint.sh ออกทันที (และ
  #     init/01-users.js ไม่สร้าง user) ถ้ารหัสผ่านตัวไหนว่าง ยังเป็น dev-…/…change-me หรือใส่ใน URI ไม่ได้
  #     mongo จึงวนรีสตาร์ตอยู่อย่างนั้น ส่วนเว็บขึ้นตามปกติเพราะไม่มีใคร depends_on มัน — ตั้งรหัสผ่านจริงใน .env
  #     ก่อน deploy ครั้งแรกที่มี mongo แล้ว `up -d mongo` ใหม่
  #
  # ไม่ใช้ `${…:?}` กันรหัสผ่านที่ว่างตรงนี้ เพราะ compose ประเมินทั้งไฟล์ทุกคำสั่ง: build ของ backend ที่ไม่เกี่ยวกับ
  # mongo เลย (ด่าน typecheck ของทุก checkout) จะล้มไปด้วย และ `:?` ก็ไม่เห็นค่าตัวอย่างที่ `:-` เติมให้อยู่ดี
  #
  # ไม่มี `volumes:` โดยตั้งใจ — `!reset` จะทิ้ง mongo-data ไปพร้อมกับ bind mount ของสคริปต์
  # **ที่ main/ ห้าม `down -v`**: mongo-data คือ log ของ production
  mongo:
    restart: unless-stopped
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_REFUSE_DEV_PASSWORDS: "true"

  # Azurite เป็น **emulator** — บน Azure จริงไม่ต้องรันบริการนี้ แต่การ deploy ของโครงการ
  # ตอนนี้ยังเป็น docker compose บนเครื่องเดียว ไม่ใช่บน Azure จึงยังรันไว้ และไฟล์ยังอยู่ครบ
  #
  # วันที่ย้ายไป storage account จริง: ตั้ง AZURE_STORAGE_ACCOUNT_URL (หรือ
  # AZURE_STORAGE_CONNECTION_STRING) ใน .env ให้ชี้ของจริง แล้วเอา `azurite` ออกจาก
  # depends_on ของ backend — บริการนี้จะไม่มีใครเรียกอีกเลย
  #
  # เขียนไว้ที่นี่แม้ไม่มีอะไรต่างจาก dev เพราะบริการที่ไม่ปรากฏในไฟล์นี้เลยคือสิ่งที่ทำให้
  # เคยรันคำสั่ง dev อยู่บน production โดยไม่มีใครเห็น (เหตุผลเดียวกับ gotenberg ข้างล่าง)
  azurite:
    restart: unless-stopped

  # gotenberg ไม่มีอะไรต่างระหว่าง dev กับ production — image เดียวกัน ไม่ bind-mount
  # source ไม่มี dev command ให้ทับ เขียนไว้ที่นี่เพราะบริการที่ไม่ปรากฏใน
  # ไฟล์นี้เลยคือสิ่งที่ทำให้เคยรันคำสั่ง dev อยู่บน production โดยไม่มีใครเห็น
  gotenberg:
    restart: unless-stopped
