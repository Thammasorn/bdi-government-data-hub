# Each checkout sets its own COMPOSE_PROJECT_NAME in .env so several developers
# can run their stacks side by side without colliding on container or volume names.
name: ${COMPOSE_PROJECT_NAME:-bdi-project}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bdi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bdi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdi} -d ${POSTGRES_DB:-bdi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Azurite — emulator ของ Azure Storage ที่ไมโครซอฟท์ทำเอง แทน MinIO เดิม
  #
  # โครงการย้ายไป Azure Blob Storage แต่เครื่อง dev ทุกเครื่องต้องรันได้โดยไม่ต้องมี
  # subscription ของ Azure และไม่ต้องแชร์ storage account กันระหว่าง checkout —
  # Azurite พูด REST API ตัวเดียวกัน `@azure/storage-blob` จึงคุยกับมันได้โดยไม่ต้องมี
  # โค้ดสาขาไหนแยกไว้เลย ที่ production ตั้ง AZURE_STORAGE_ACCOUNT_URL ชี้ storage account
  # จริงแทน แล้วบริการนี้ก็ไม่ถูกใช้
  #
  # เปิดเฉพาะ blob (10000) ไม่เปิด queue/table เพราะระบบไม่ได้ใช้
  #
  # **ไม่เปิด `--loose`** โดยตั้งใจ — โหมดนั้นผ่อนการตรวจ header ให้หลวมกว่า Azure จริง
  # ซึ่งจะทำให้บั๊กที่ควรเจอในเครื่องไปโผล่บน production แทน และนั่นทำลายเหตุผลทั้งหมด
  # ของการใช้ emulator ที่เจ้าของ API ทำเอง
  #
  # **แต่ต้องเปิด `--skipApiVersionCheck`** เพราะ `@azure/storage-blob` v12 ส่ง
  # `x-ms-version: 2026-06-06` ขณะที่ Azurite ตัวล่าสุดรู้จักถึงแค่ 2025-11-05 และตอบ
  # `The API version 2026-06-06 is not supported by Azurite` กลับมาทุกคำสั่ง — บูตขึ้นแต่
  # /health/ready แดงและอัปโหลดไม่ได้เลย (เจอตอนรันจริงบน branch นี้) เป็นการไล่ตามเวอร์ชัน
  # ของ emulator ไม่ใช่ความต่างของพฤติกรรม: ธงนี้ข้ามแค่ด่านตรวจเลขเวอร์ชัน แล้ว Azurite
  # ก็ให้บริการด้วย API รุ่นที่มันมี ซึ่งครอบคลุมทุกอย่างที่ระบบนี้เรียก (create/exists/
  # upload/download) เอาออกได้เมื่อ Azurite ตามทัน SDK
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      # image ไม่มี curl/wget — ใช้ node ที่ติดมากับ image เอง
      # Azurite ตอบ 400 ให้ GET เปล่า ๆ ที่ราก ซึ่งก็พอบอกได้แล้วว่ามันรับ TCP และตอบ HTTP
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10

  # ไม่มีบริการ init สำหรับสร้าง container แล้ว — ต่างจาก minio-init เดิม
  # backend เรียก ensureContainer() ตอนบูตอยู่แล้ว (src/index.ts) และ Azurite ไม่มี
  # CLI แบบ `mc` ติดมาใน image ให้เรียกใช้ การมีบริการเพิ่มอีกตัวจึงได้แต่ความซ้ำซ้อน

  # ตัวแปลง .docx -> PDF ของเอกสารกฎหมาย A0–A3
  #
  # เอกสารเหล่านี้เป็น template .docx ที่ BDI แก้เองได้ผ่านหน้าแอดมิน เลย์เอาต์จึงต้อง
  # มาจาก LibreOffice ที่จัดหน้าจากไฟล์ต้นฉบับ ไม่ใช่จากโค้ดที่วาดทับตามพิกัด — พิกัด
  # จะใช้ไม่ได้ทันทีที่มีคนอัปโหลด template ใหม่ และค่าที่ยาวกว่าช่องว่างจะล้น
  #
  # image ต่อยอดจาก gotenberg/gotenberg:8-libreoffice เพื่อฝังฟอนต์ TH SarabunPSK
  # ดูเหตุผลใน gotenberg/Dockerfile — ไม่มีฟอนต์คือเลย์เอาต์เพี้ยนทั้งฉบับ
  gotenberg:
    build:
      context: ./gotenberg
    restart: unless-stopped
    # ไม่ผูกพอร์ตออกโฮสต์: เรียกจาก backend ผ่าน compose network เท่านั้น
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bdi}:${POSTGRES_PASSWORD:-bdi_dev_password}@postgres:5432/${POSTGRES_DB:-bdi}?schema=public
      # ค่าตั้งต้นคือ connection string ของ Azurite ตามที่เอกสารของ Azure ประกาศไว้
      # (account name/key ชุดนี้เป็นค่าคงที่สาธารณะของ emulator ไม่ใช่ความลับ) — ตั้ง
      # AZURE_STORAGE_CONNECTION_STRING หรือ AZURE_STORAGE_ACCOUNT_URL ใน .env เพื่อชี้ไป
      # storage account จริง
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-bdi-uploads}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ตั้งค่า ADMIN_API_TOKEN ใน .env ก่อน}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-8}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      ACTIVATION_KEY_SECRET: ${ACTIVATION_KEY_SECRET:-}
      ACTIVATION_KEY_TTL_DAYS: ${ACTIVATION_KEY_TTL_DAYS:-7}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-BDI Datahub <no-reply@bdi.or.th>}
      THAID_ROOT_URL: ${THAID_ROOT_URL:-}
      THAID_CLIENT_ID: ${THAID_CLIENT_ID:-}
      THAID_CLIENT_SECRET: ${THAID_CLIENT_SECRET:-}
      THAID_API_KEY: ${THAID_API_KEY:-}
      THAID_REDIRECT_URI: ${THAID_REDIRECT_URI:-}
      THAID_SCOPE: ${THAID_SCOPE:-}
      THAID_USE_PID: ${THAID_USE_PID:-true}
      THAID_REQUIRE_NONCE: ${THAID_REQUIRE_NONCE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      # ตรึงไว้ — โดเมนสาธารณะ bdi-api.thammasorn.org ชี้มาที่พอร์ตนี้
      # checkout อื่นให้ทับด้วย docker-compose.override.yml (new-dev.sh สร้างให้)
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ตัวส่งอีเมลจาก outbox notification.notification_delivery
  # สคีมาใหม่ไม่ส่งอีเมลใน request handler แล้ว — เขียนแถวรอไว้ให้ตัวนี้หยิบไปส่ง
  # ใช้ environment ชุดเดียวกับ backend เพราะต้องต่อ database และ SMTP เหมือนกัน
  delivery-worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    command: ["npm", "run", "worker:delivery"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bdi}:${POSTGRES_PASSWORD:-bdi_dev_password}@postgres:5432/${POSTGRES_DB:-bdi}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ตั้งค่า ADMIN_API_TOKEN ใน .env ก่อน}
      ACTIVATION_KEY_SECRET: ${ACTIVATION_KEY_SECRET:-}
      # worker ไม่ได้แตะไฟล์เลย แต่ env.ts บังคับว่าต้องมีทางต่อ storage อย่างน้อยหนึ่งทาง
      # จึงต้องส่งมาด้วย ไม่งั้น process ตายตั้งแต่ import (ของเดิมส่ง MINIO_ROOT_USER ด้วยเหตุผลเดียวกัน)
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-bdi-uploads}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-BDI Datahub <no-reply@bdi.or.th>}
      DELIVERY_POLL_INTERVAL_MS: ${DELIVERY_POLL_INTERVAL_MS:-15000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-5}
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Browser-side: must be reachable from the host.
      # ว่าง = same-origin (proxy ผ่าน next.config.ts) — ใช้ `-` ไม่ใช่ `:-` เพื่อให้ค่าว่างคงอยู่
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      ALLOWED_DEV_ORIGINS: ${APP_URL:-}
      # Server-side (RSC / route handlers): uses the compose network.
      INTERNAL_API_URL: http://backend:4000
    ports:
      # ตรึงไว้ — โดเมนสาธารณะ bdi.thammasorn.org ชี้มาที่พอร์ตนี้
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next

volumes:
  postgres-data:
  azurite-data:
  backend-node-modules:
  frontend-node-modules:
  frontend-next-cache:
