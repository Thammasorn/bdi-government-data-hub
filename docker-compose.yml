# Each checkout sets its own COMPOSE_PROJECT_NAME in .env so several developers
# can run their stacks side by side without colliding on container or volume names.
name: ${COMPOSE_PROJECT_NAME:-bdi-project}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bdi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bdi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdi} -d ${POSTGRES_DB:-bdi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Azurite — emulator ของ Azure Storage ที่ไมโครซอฟท์ทำเอง แทน MinIO เดิม
  #
  # โครงการย้ายไป Azure Blob Storage แต่เครื่อง dev ทุกเครื่องต้องรันได้โดยไม่ต้องมี
  # subscription ของ Azure และไม่ต้องแชร์ storage account กันระหว่าง checkout —
  # Azurite พูด REST API ตัวเดียวกัน `@azure/storage-blob` จึงคุยกับมันได้โดยไม่ต้องมี
  # โค้ดสาขาไหนแยกไว้เลย ที่ production ตั้ง AZURE_STORAGE_ACCOUNT_URL ชี้ storage account
  # จริงแทน แล้วบริการนี้ก็ไม่ถูกใช้
  #
  # เปิดเฉพาะ blob (10000) ไม่เปิด queue/table เพราะระบบไม่ได้ใช้
  #
  # **ไม่เปิด `--loose`** โดยตั้งใจ — โหมดนั้นผ่อนการตรวจ header ให้หลวมกว่า Azure จริง
  # ซึ่งจะทำให้บั๊กที่ควรเจอในเครื่องไปโผล่บน production แทน และนั่นทำลายเหตุผลทั้งหมด
  # ของการใช้ emulator ที่เจ้าของ API ทำเอง
  #
  # **แต่ต้องเปิด `--skipApiVersionCheck`** เพราะ `@azure/storage-blob` v12 ส่ง
  # `x-ms-version: 2026-06-06` ขณะที่ Azurite ตัวล่าสุดรู้จักถึงแค่ 2025-11-05 และตอบ
  # `The API version 2026-06-06 is not supported by Azurite` กลับมาทุกคำสั่ง — บูตขึ้นแต่
  # /health/ready แดงและอัปโหลดไม่ได้เลย (เจอตอนรันจริงบน branch นี้) เป็นการไล่ตามเวอร์ชัน
  # ของ emulator ไม่ใช่ความต่างของพฤติกรรม: ธงนี้ข้ามแค่ด่านตรวจเลขเวอร์ชัน แล้ว Azurite
  # ก็ให้บริการด้วย API รุ่นที่มันมี ซึ่งครอบคลุมทุกอย่างที่ระบบนี้เรียก (create/exists/
  # upload/download) เอาออกได้เมื่อ Azurite ตามทัน SDK
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      # image ไม่มี curl/wget — ใช้ node ที่ติดมากับ image เอง
      # Azurite ตอบ 400 ให้ GET เปล่า ๆ ที่ราก ซึ่งก็พอบอกได้แล้วว่ามันรับ TCP และตอบ HTTP
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10

  # ไม่มีบริการ init สำหรับสร้าง container แล้ว — ต่างจาก minio-init เดิม
  # backend เรียก ensureContainer() ตอนบูตอยู่แล้ว (src/index.ts) และ Azurite ไม่มี
  # CLI แบบ `mc` ติดมาใน image ให้เรียกใช้ การมีบริการเพิ่มอีกตัวจึงได้แต่ความซ้ำซ้อน

  # ตัวแปลง .docx -> PDF ของเอกสารกฎหมาย A0–A3
  #
  # เอกสารเหล่านี้เป็น template .docx ที่ BDI แก้เองได้ผ่านหน้าแอดมิน เลย์เอาต์จึงต้อง
  # มาจาก LibreOffice ที่จัดหน้าจากไฟล์ต้นฉบับ ไม่ใช่จากโค้ดที่วาดทับตามพิกัด — พิกัด
  # จะใช้ไม่ได้ทันทีที่มีคนอัปโหลด template ใหม่ และค่าที่ยาวกว่าช่องว่างจะล้น
  #
  # image ต่อยอดจาก gotenberg/gotenberg:8-libreoffice เพื่อฝังฟอนต์ TH SarabunPSK
  # ดูเหตุผลใน gotenberg/Dockerfile — ไม่มีฟอนต์คือเลย์เอาต์เพี้ยนทั้งฉบับ
  gotenberg:
    build:
      context: ./gotenberg
    restart: unless-stopped
    # ไม่ผูกพอร์ตออกโฮสต์: เรียกจาก backend ผ่าน compose network เท่านั้น
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB — log store: สำเนาค้นหาได้ของ audit.audit_event และที่เก็บ error ของระบบ · ดู docs/21
  #
  # เป็นของเสริม ไม่ใช่ของที่ระบบขาดไม่ได้ จึง**ไม่ผูกพอร์ตออกโฮสต์ และห้ามมี service ไหน depends_on ตัวนี้**:
  # mongo ล่ม ขึ้นไม่ได้ หรือชนอะไรตอน deploy แล้วเว็บต้องยังขึ้น (เหตุ azurite พอร์ต 9000 เคยทำเว็บสาธารณะล่มมาแล้ว)
  # backend รายงานสถานะไว้ที่ /health/ready แต่ไม่นับรวมใน healthy · ปิดทั้งหมดด้วย LOG_STORE_ENABLED=false
  #
  # cache ของ WiredTiger ตั้งเองเสมอ: ค่าตั้งต้นคือครึ่งหนึ่งของ RAM เครื่อง *ต่อหนึ่ง instance* และเครื่องนี้รันหลาย
  # stack พร้อมกัน (prod overlay ให้ 0.5 GB) · log ของคอนเทนเนอร์มีเพดาน เพราะ / กับ /hdd1tb เคยเต็มมาแล้ว
  #
  # รหัสผ่านทั้งสามใช้**ครั้งเดียวตอน volume ว่าง** (init/01-users.js) — เปลี่ยนใน .env ทีหลังไม่มีผลกับ volume เดิม
  # ค่าตั้งต้นเป็นค่าตัวอย่างสาธารณะ ซึ่ง prod overlay สั่งให้ entrypoint.sh ไม่ยอมเริ่มถ้ายังใช้อยู่
  # รหัสผ่านของ backend/worker ถูกแทนลง URI ตรง ๆ ต้องเป็นฐานสิบหก (`openssl rand -hex 32`)
  #
  # `--slowOpSampleRate 0` ปิดบรรทัด "Slow query" ใน log ของคอนเทนเนอร์: mongod พิมพ์คำสั่งที่ช้ากว่า slowms (100 ms)
  # ทั้งคำสั่ง รวม `$setOnInsert` ของเอกสาร activity ทั้งใบ (ชื่อ อีเมลบัญชี IP UA บันทึกที่ปิดเลขแล้ว) และตัวกรองของการค้น
  # สำเนานั้นอยู่นอกตาราง retention และการตัด IP/UA ไปจนกว่า json-file จะหมุนทิ้ง ซึ่งกับ `--quiet` อาจเป็นเดือน (ตรวจขั้น 6,
  # 2026-09-30) Community ไม่มี redactClientLogData ให้ใช้ · เปิดชั่วคราวตอนไล่ความช้าด้วย root:
  # `db.setProfilingLevel(0, { slowms: 100, sampleRate: 1 })` แล้วตั้ง `sampleRate: 0` คืนเมื่อเสร็จ (restart ก็กลับเป็น 0)
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    entrypoint: ["sh", "/opt/bdi-mongo/entrypoint.sh"]
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.25", "--slowOpSampleRate", "0"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-bdi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-dev-mongo-root-change-me}
      MONGO_BACKEND_PASSWORD: ${MONGO_BACKEND_PASSWORD:-dev-mongo-backend-change-me}
      MONGO_WORKER_PASSWORD: ${MONGO_WORKER_PASSWORD:-dev-mongo-worker-change-me}
      MONGODB_DB: ${MONGODB_DB:-bdi_logs}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo:/opt/bdi-mongo:ro
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # ping ไม่ต้อง login — บอกแค่ว่า mongod รับคำสั่งแล้ว ผู้ใช้ของแอปดูที่ logStore ใน /health/ready
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bdi}:${POSTGRES_PASSWORD:-bdi_dev_password}@postgres:5432/${POSTGRES_DB:-bdi}?schema=public
      # ค่าตั้งต้นคือ connection string ของ Azurite ตามที่เอกสารของ Azure ประกาศไว้
      # (account name/key ชุดนี้เป็นค่าคงที่สาธารณะของ emulator ไม่ใช่ความลับ) — ตั้ง
      # AZURE_STORAGE_CONNECTION_STRING หรือ AZURE_STORAGE_ACCOUNT_URL ใน .env เพื่อชี้ไป
      # storage account จริง
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-bdi-uploads}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ตั้งค่า ADMIN_API_TOKEN ใน .env ก่อน}
      # เฉพาะ backend — worker ไม่ได้รับคำขอที่ถือ x-admin-token
      ADMIN_TOKEN_WATCH_FPS: ${ADMIN_TOKEN_WATCH_FPS:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-8}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      ACTIVATION_KEY_SECRET: ${ACTIVATION_KEY_SECRET:-}
      ACTIVATION_KEY_TTL_DAYS: ${ACTIVATION_KEY_TTL_DAYS:-7}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ระบบกลางเพื่อการแบ่งปันข้อมูลดิจิทัล <no-reply@bdi.or.th>}
      # ไม่ตั้ง = ไม่มีหัวข้อ Reply-To ในอีเมล — ไม่มีค่าตั้งต้น ต่างจาก SUPPORT_EMAIL ข้างล่าง
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      # ช่องทางติดต่อที่พิมพ์ท้ายอีเมลทุกฉบับ — ต้องส่งให้ทั้ง backend และ worker เพราะทั้งคู่
      # ประกอบอีเมลเอง ค่าตั้งต้นคือช่องทางจริงของ BDI ไม่ต้องมีใน .env ก็ถูกอยู่แล้ว
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-d2share-support@bdi.or.th}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-02-480-8833}
      THAID_ROOT_URL: ${THAID_ROOT_URL:-}
      THAID_CLIENT_ID: ${THAID_CLIENT_ID:-}
      THAID_CLIENT_SECRET: ${THAID_CLIENT_SECRET:-}
      THAID_API_KEY: ${THAID_API_KEY:-}
      THAID_REDIRECT_URI: ${THAID_REDIRECT_URI:-}
      THAID_SCOPE: ${THAID_SCOPE:-}
      THAID_USE_PID: ${THAID_USE_PID:-true}
      THAID_REQUIRE_NONCE: ${THAID_REQUIRE_NONCE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # log store (MongoDB) — ดู lib/log-store.ts · สวิตช์ปิดคือ LOG_STORE_ENABLED=false (ค่าบูลีน ไม่ใช่การเว้น URI
      # ให้ว่าง เพราะ `:-` ถือว่าค่าว่างคือไม่ได้ตั้ง แล้วเติม URI ตั้งต้นกลับมาให้เอง)
      # backend ใช้ bdi_backend ซึ่งลบอะไรไม่ได้ · ชี้ Mongo ตัวอื่นด้วย MONGODB_BACKEND_URI
      # **ชุดเดียวกันต้องอยู่ใน delivery-worker ข้างล่างด้วย** (ต่างกันแค่ user)
      LOG_STORE_ENABLED: ${LOG_STORE_ENABLED:-true}
      MONGODB_URI: ${MONGODB_BACKEND_URI:-mongodb://bdi_backend:${MONGO_BACKEND_PASSWORD:-dev-mongo-backend-change-me}@mongo:27017/${MONGODB_DB:-bdi_logs}?authSource=${MONGODB_DB:-bdi_logs}}
      MONGODB_DB: ${MONGODB_DB:-bdi_logs}
      LOG_STORE_MAX_MB: ${LOG_STORE_MAX_MB:-}
      # กุญแจของ key ค้นหา cid#/email# ในสำเนากิจกรรม — ว่าง = ค่าของ dev ใน env.ts, production ว่าง = ไม่มี key ค้นหา
      # ต้องเป็นค่าเดียวกับของ delivery-worker ข้างล่าง (relay ใช้ทำ key ของทุกแถว)
      LOG_HASH_KEY: ${LOG_HASH_KEY:-}
      # token ของ API อ่าน log (x-log-token ของ /api/admin/logs/*) — ว่าง = ค่าของ dev ใน env.ts, production ว่างหรือเป็น
      # ค่าตัวอย่าง = API นั้นตอบ 503 · **backend เท่านั้น** worker ไม่ได้ให้บริการ API นี้
      LOG_READ_TOKEN: ${LOG_READ_TOKEN:-}
      # ความลับที่ Next server แนบกับรายงาน error ของตัวเอง (POST /api/client-errors) — ตรงแล้วเก็บเป็น frontend-server
      # ว่าง = ค่าของ dev ใน env.ts, production ว่างหรือเป็นค่าตัวอย่าง = รายงานของ Next server เก็บเป็น browser ที่ยืนยันไม่ได้
      # **ค่าเดียวกันต้องอยู่ใน frontend ข้างล่าง**
      INGEST_SERVER_TOKEN: ${INGEST_SERVER_TOKEN:-}
      # ชื่อ deployment ที่ติดไปกับทุก error event (ค่าตั้งต้นคือชื่อ project ของ compose: bdi-main, bdi-dev_…)
      # **ไม่มี RELEASE ตรงนี้โดยตั้งใจ**: image ของ production ฝัง RELEASE=<SHA> ไว้แล้ว (backend/Dockerfile) และค่าว่าง
      # จาก `${RELEASE:-}` จะทับค่านั้นจนกลายเป็น `dev`
      DEPLOY_ENV: ${DEPLOY_ENV:-${COMPOSE_PROJECT_NAME:-bdi-project}}
    ports:
      # ตรึงไว้ — โดเมนสาธารณะ bdi-api.thammasorn.org ชี้มาที่พอร์ตนี้
      # checkout อื่นให้ทับด้วย docker-compose.override.yml (new-dev.sh สร้างให้)
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ตัวส่งอีเมลจาก outbox notification.notification_delivery
  # สคีมาใหม่ไม่ส่งอีเมลใน request handler แล้ว — เขียนแถวรอไว้ให้ตัวนี้หยิบไปส่ง
  # ใช้ environment ชุดเดียวกับ backend เพราะต้องต่อ database และ SMTP เหมือนกัน
  delivery-worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    command: ["npm", "run", "worker:delivery"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bdi}:${POSTGRES_PASSWORD:-bdi_dev_password}@postgres:5432/${POSTGRES_DB:-bdi}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ตั้งค่า ADMIN_API_TOKEN ใน .env ก่อน}
      ACTIVATION_KEY_SECRET: ${ACTIVATION_KEY_SECRET:-}
      # worker ไม่ได้แตะไฟล์เลย แต่ env.ts บังคับว่าต้องมีทางต่อ storage อย่างน้อยหนึ่งทาง
      # จึงต้องส่งมาด้วย ไม่งั้น process ตายตั้งแต่ import (ของเดิมส่ง MINIO_ROOT_USER ด้วยเหตุผลเดียวกัน)
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-bdi-uploads}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ระบบกลางเพื่อการแบ่งปันข้อมูลดิจิทัล <no-reply@bdi.or.th>}
      # ไม่ตั้ง = ไม่มีหัวข้อ Reply-To ในอีเมล — ไม่มีค่าตั้งต้น ต่างจาก SUPPORT_EMAIL ข้างล่าง
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      # ช่องทางติดต่อที่พิมพ์ท้ายอีเมลทุกฉบับ — ต้องส่งให้ทั้ง backend และ worker เพราะทั้งคู่
      # ประกอบอีเมลเอง ค่าตั้งต้นคือช่องทางจริงของ BDI ไม่ต้องมีใน .env ก็ถูกอยู่แล้ว
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-d2share-support@bdi.or.th}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-02-480-8833}
      DELIVERY_POLL_INTERVAL_MS: ${DELIVERY_POLL_INTERVAL_MS:-15000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-5}
      # log store — ชุดเดียวกับ backend แต่เป็น user bdi_worker (ลบได้ สำหรับ prune ตามอายุ) · ชี้ Mongo ตัวอื่นด้วย
      # MONGODB_WORKER_URI · ไม่มี depends_on mongo ตรงนี้เช่นกัน: ลูปส่งอีเมลต้องไม่ผูกกับ log store
      LOG_STORE_ENABLED: ${LOG_STORE_ENABLED:-true}
      MONGODB_URI: ${MONGODB_WORKER_URI:-mongodb://bdi_worker:${MONGO_WORKER_PASSWORD:-dev-mongo-worker-change-me}@mongo:27017/${MONGODB_DB:-bdi_logs}?authSource=${MONGODB_DB:-bdi_logs}}
      MONGODB_DB: ${MONGODB_DB:-bdi_logs}
      # worker เป็นคนเทียบค่านี้กับขนาดจริงทุกชั่วโมง (workers/log-upkeep.ts)
      LOG_STORE_MAX_MB: ${LOG_STORE_MAX_MB:-}
      # ค่าเดียวกับของ backend — relay (workers/log-relay.ts) ใช้ทำ key ค้นหา cid#/email# ของทุกแถวที่คัดลอก
      LOG_HASH_KEY: ${LOG_HASH_KEY:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-${COMPOSE_PROJECT_NAME:-bdi-project}}
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Browser-side: must be reachable from the host.
      # ว่าง = same-origin (proxy ผ่าน next.config.ts) — ใช้ `-` ไม่ใช่ `:-` เพื่อให้ค่าว่างคงอยู่
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      ALLOWED_DEV_ORIGINS: ${APP_URL:-}
      # Server-side (RSC / route handlers): uses the compose network.
      INTERNAL_API_URL: http://backend:4000
      # แนบกับรายงาน error ของ Next server (frontend/lib/server-error-report.ts) — อ่านตอนรัน ห้ามเป็น NEXT_PUBLIC_
      # ค่าตั้งต้นตรงกับค่าของ dev ใน backend/src/env.ts · production ตั้งใน .env ค่าเดียวกับของ backend
      INGEST_SERVER_TOKEN: ${INGEST_SERVER_TOKEN:-dev-ingest-token-change-me}
    ports:
      # ตรึงไว้ — โดเมนสาธารณะ bdi.thammasorn.org ชี้มาที่พอร์ตนี้
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next

volumes:
  postgres-data:
  azurite-data:
  # log store — `down -v` ลบทิ้ง ที่ dev ไม่เป็นไร แต่ที่ main/ คือ log ของ production ห้ามใช้ -v ที่นั่น
  mongo-data:
  backend-node-modules:
  frontend-node-modules:
  frontend-next-cache:
